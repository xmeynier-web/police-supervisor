<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Police Supervisor CSU — operator-supervisor-ops</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #162032;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --patrouille: #2563eb;
      --intervention: #dc2626;
      --disponible: #16a34a;
      --pause: #d97706;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 54px;
      min-height: 54px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .pill-project {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-family: monospace;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .header-stats strong { color: var(--text); }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 330px 1fr 350px;
      width: 100%;
    }

    aside, .right-pane {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    aside { border-right: 1px solid var(--border); }
    .right-pane { border-left: 1px solid var(--border); }

    .map-area {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background: #1e293b;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .pane-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
    }

    .filter-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
      font-weight: 700;
    }

    .scroll-list {
      padding: 10px 12px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .unit-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .unit-card:hover { border-color: var(--accent); }
    .unit-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .unit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .bg-PATROUILLE { background: var(--patrouille); }
    .bg-INTERVENTION { background: var(--intervention); }
    .bg-DISPONIBLE { background: var(--disponible); }
    .bg-PAUSE { background: var(--pause); }

    .unit-meta {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .equip-tags {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .equip-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(148, 163, 184, 0.14);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .map-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 500;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.92);
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .btn {
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .right-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
    }

    .tab-btn {
      padding: 10px;
      background: transparent;
      color: var(--muted);
      border: none;
      border-bottom: 2px solid transparent;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .tab-panel.active { display: flex; }

    form.dispatch-form {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      display: grid;
      gap: 8px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
    }

    .mission-item, .mci-entry {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .mci-time {
      color: var(--accent);
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .diag-box {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      font-family: monospace;
      font-size: 11px;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .unit-divicon-root {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .unit-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .unit-label-box {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      white-space: nowrap;
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      pointer-events: none;
      line-height: 1.2;
    }

    .unit-label-name { font-size: 12px; font-weight: 700; }
    .unit-label-status { font-size: 10px; color: #cbd5e1; }

    .status-PATROUILLE { background-color: var(--patrouille); }
    .status-INTERVENTION { background-color: var(--intervention); }
    .status-DISPONIBLE { background-color: var(--disponible); }
    .status-PAUSE { background-color: var(--pause); }
  </style>
</head>
<body>

    <div class="brand">
      <span>Police Supervisor CSU</span>
      <span class="pill-project">operator-supervisor-ops</span>
    </div>
    <div class="header-stats">
      <span>Unités suivies : <strong id="stat-total">0</strong></span>
      <span>En intervention : <strong id="stat-interv">0</strong></span>
      <span id="sync-indicator">Démarrage...</span>
    </div>
  </header>

  <div class="workspace">
    <aside>
      <div class="pane-header">
        <span>Unités opérationnelles</span>
        <span id="selected-unit-badge" style="font-size:11px;color:var(--accent);">Aucune sélection</span>
      </div>
      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="ALL">Tous</button>
