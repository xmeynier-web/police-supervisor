<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Police Supervisor CSU</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 52px;
      background: #162032;
      border-bottom: 1px solid #334155;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .pill {
      font-family: monospace;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .stats { display: flex; gap: 14px; font-size: 13px; color: #94a3b8; }
    .stats strong { color: #f8fafc; }
    .main-layout {
      flex: 1;
      display: flex;
      min-height: 0;
      width: 100%;
    }
    .col-left {
      width: 320px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .col-map {
      flex: 1;
      position: relative;
      background: #1e293b;
      min-width: 0;
    }
    #map { width: 100%; height: 100%; }
    .col-right {
      width: 340px;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .pane-title {
      padding: 10px 12px;
      background: #162032;
      border-bottom: 1px solid #334155;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
    .filters {
      padding: 8px 10px;
      background: #162032;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .fbtn {
      padding: 4px 9px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
    }
    .fbtn.active {
      background: #38bdf8;
      color: #082f49;
      border-color: #38bdf8;
      font-weight: 700;
    }
    .scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .card {
      background: #162032;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .card.selected { border-color: #38bdf8; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      color: #fff;
    }
    .st-PATROUILLE { background: #2563eb; }
    .st-INTERVENTION { background: #dc2626; }
    .st-DISPONIBLE { background: #16a34a; }
    .st-PAUSE { background: #d97706; }
    .meta { margin-top: 5px; font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between; }
    .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { font-size: 11px; padding: 2px 6px; border-radius: 5px; background: rgba(148,163,184,0.15); }
    .toolbar {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 500;
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .btn {
      background: #38bdf8;
      color: #082f49;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.sec { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    .tabs { display: flex; background: #162032; border-bottom: 1px solid #334155; }
    .tbtn {
      flex: 1;
      padding: 9px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #94a3b8;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .tbtn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    .panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .panel.active { display: flex; }
    form.box {
      padding: 10px;
      background: #162032;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    input, select, textarea {
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 12px;
      font-family: inherit;
    }
    .item {
      background: #162032;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 8px 10px;
      margin-bottom: 7px;
      font-size: 12px;
    }
    .time { color: #38bdf8; font-family: monospace; font-size: 11px; margin-bottom: 2px; }
    .marker-wrap { position: relative; width: 20px; height: 20px; }
    .marker-dot {
      width: 20px; height: 20px; border-radius: 50%;
      border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.45);
    }
    .marker-tag {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.92); color: #fff; padding: 2px 7px;
      border-radius: 5px; font-size: 11px; font-weight: 700; white-space: nowrap;
      pointer-events: none; text-align: center;
    }
    .marker-sub { display: block; font-size: 10px; font-weight: 500; color: #cbd5e1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>Police Supervisor CSU</span>
      <span class="pill">operator-supervisor-ops</span>
    </div>
    <div class="stats">
      <span>Unités : <strong id="cnt-all">0</strong></span>
      <span>Intervention : <strong id="cnt-int">0</strong></span>
      <span id="status-txt">Chargement...</span>
    </div>
  </header>

  <div class="main-layout">
    <div class="col-left">
      <div class="pane-title">
        <span>Unités</span>
        <span id="sel-txt" style="color:#38bdf8;font-size:11px;">Aucune</span>
      </div>
      <div class="filters" id="filters">
        <button class="fbtn active" data-f="ALL">Tous</button>
        <button class="fbtn" data-f="PATROUILLE">Patrouille</button>
        <button class="fbtn" data-f="INTERVENTION">Intervention</button>
        <button class="fbtn" data-f="DISPONIBLE">Disponible</button>
        <button class="fbtn" data-f="PAUSE">Pause</button>
      </div>
      <div class="scroll" id="units-box">
        <p style="color:#94a3b8;font-size:12px;">Connexion Firestore en cours...</p>
      </div>
    </div>

    <div class="col-map">
      <div id="map"></div>
      <div class="toolbar">
        <button class="btn sec" id="btn-trail">Trajet : OFF</button>
        <button class="btn sec" id="btn-fit">Recentrer</button>
      </div>
    </div>

    <div class="col-right">
      <div class="tabs">
        <button class="tbtn active" data-p="dispatch">Dispatch</button>
        <button class="tbtn" data-p="mci">Main-courante</button>
      </div>
      <div class="panel active" id="p-dispatch">
        <form class="box" id="f-dispatch">
          <input type="text" id="m-title" placeholder="Intitulé de mission" required />
          <select id="m-unit"><option value="">Unité (optionnel)</option></select>
          <textarea id="m-notes" rows="2" placeholder="Lieu / consignes"></textarea>
          <button type="submit" class="btn">Dispatcher & MCI</button>
        </form>
        <div class="scroll" id="missions-box"></div>
      </div>
      <div class="panel" id="p-mci">
        <form class="box" id="f-mci">
          <input type="text" id="c-msg" placeholder="Mention main-courante..." required />
          <button type="submit" class="btn">Enregistrer MCI</button>
        </form>
        <div class="scroll" id="mci-box"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    window.supMap = null;
    if (typeof L !== "undefined") {
      window.supMap = L.map("map").setView([48.6918631, 2.3108942], 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }).addTo(window.supMap);
      new ResizeObserver(function () {
        if (window.supMap) window.supMap.invalidateSize();
      }).observe(document.getElementById("map"));
      setTimeout(function () {
        if (window.supMap) window.supMap.invalidateSize();
      }, 150);
    }

    document.querySelectorAll(".tbtn").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll(".tbtn").forEach(function (x) { x.classList.remove("active"); });
        document.querySelectorAll(".panel").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        document.getElementById("p-" + b.dataset.p).classList.add("active");
        setTimeout(function () {
          if (window.supMap) window.supMap.invalidateSize();
        }, 60);
      });
    });

    setTimeout(function () {
      var st = document.getElementById("status-txt");
      var box = document.getElementById("units-box");
      if (st && st.textContent === "Chargement...") {
        st.textContent = "Timeout / Bloqué";
        st.style.color = "#f87171";
        if (box) {
          box.innerHTML = "<p style='color:#f87171;font-size:12px;'>Aucune réponse de Firestore après 5s. Vérifiez la console (F12) ou les règles Firestore.</p>";
        }
      }
    }, 5000);
  </script>

  <script type="module">
    const statusTxt = document.getElementById("status-txt");
    const unitsBox = document.getElementById("units-box");

    function showErr(label, e) {
      if (statusTxt) {
        statusTxt.textContent = "Erreur";
        statusTxt.style.color = "#f87171";
      }
      if (unitsBox) {
        unitsBox.innerHTML = "<p style='color:#f87171;font-size:12px;'>" + label + " : " + String(e?.message || e?.code || e) + "</p>";
      }
    }

    async function loadFirebaseSdk() {
      try {
        const appMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
        const fsMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
        return { ...appMod, ...fsMod };
      } catch (_) {
        const appMod = await import("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app.js");
        const fsMod = await import("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore.js");
        return { ...appMod, ...fsMod };
      }
    }

    try {
      const {
        initializeApp, getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp
      } = await loadFirebaseSdk();

      const firebaseConfig = {
        apiKey: "AIzaSyCua2pik8r_B9bo8s-OqFQunFVPPwHbmCg",
        authDomain: "operator-supervisor-ops.firebaseapp.com",
        projectId: "operator-supervisor-ops",
        storageBucket: "operator-supervisor-ops.firebasestorage.app",
        messagingSenderId: "390289085067",
        appId: "1:390289085067:web:f6128eec4af06fb4143a8e"
      };

      const STATUS_LABELS = {
        PATROUILLE: "En patrouille",
        INTERVENTION: "En intervention",
        DISPONIBLE: "Disponible",
        PAUSE: "En pause"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const map = window.supMap;

      const missionsBox = document.getElementById("missions-box");
      const mciBox = document.getElementById("mci-box");
      const mUnitSel = document.getElementById("m-unit");

      const markers = new Map();
      let units = [];
      let filterCode = "ALL";
      let selectedId = null;
      let trailOn = false;
      let trailLine = null;
      let unsubTrail = null;
      let fittedOnce = false;

      function esc(v) {
        return String(v ?? "")
          .replace(/&/g, "&")
          .replace(/</g, "<")
          .replace(/>/g, ">")
          .replace(/"/g, """);
      }

      function normStatus(c) {
        const u = String(c || "PATROUILLE").toUpperCase();
        return Object.prototype.hasOwnProperty.call(STATUS_LABELS, u) ? u : "PATROUILLE";
      }

      function makeIcon(id, code, label) {
        const st = normStatus(code);
        return L.divIcon({
          className: "",
          html: "<div class='marker-wrap'><div class='marker-dot st-" + st + "'></div><div class='marker-tag'>" + esc(id) + "<span class='marker-sub'>" + esc(label) + "</span></div></div>",
          iconSize: [20, 20],
          iconAnchor: [10, 10],
          popupAnchor: [0, -12]
        });
      }

      function stopTrail() {
        if (unsubTrail) { unsubTrail(); unsubTrail = null; }
        if (trailLine && map) { map.removeLayer(trailLine); trailLine = null; }
      }

      function startTrail(id) {
        stopTrail();
        if (!trailOn || !id || !map) return;
        const qHist = query(collection(db, "live_positions", id, "history"), orderBy("updatedAt", "desc"), limit(50));
        unsubTrail = onSnapshot(qHist, (snap) => {
          const pts = [];
          snap.forEach((d) => {
            const x = d.data() || {};
            if (typeof x.latitude === "number" && typeof x.longitude === "number") {
              pts.push([x.latitude, x.longitude]);
            }
          });
          pts.reverse();
          if (trailLine) map.removeLayer(trailLine);
          if (pts.length > 1) {
            trailLine = L.polyline(pts, { color: "#38bdf8", weight: 3, dashArray: "6,6" }).addTo(map);
          }
        }, () => {});
      }

      function pickUnit(id, center) {
        selectedId = id;
        document.getElementById("sel-txt").textContent = id || "Aucune";
        const u = units.find((item) => item.id === id);
        if (u && center && map && typeof u.lat === "number" && typeof u.lng === "number") {
          map.setView([u.lat, u.lng], 16);
          markers.get(id)?.openPopup();
        }
        startTrail(id);
        renderUnits();
      }

      function renderUnits() {
        const list = filterCode === "ALL" ? units : units.filter((u) => u.status === filterCode);
        document.getElementById("cnt-all").textContent = String(units.length);
        document.getElementById("cnt-int").textContent = String(units.filter((u) => u.status === "INTERVENTION").length);

        const prev = mUnitSel.value;
        mUnitSel.innerHTML = "<option value=''>Unité (optionnel)</option>";
        units.forEach((u) => {
          const o = document.createElement("option");
          o.value = u.id;
          o.textContent = u.id;
          mUnitSel.appendChild(o);
        });
        if (prev) mUnitSel.value = prev;

        if (list.length === 0) {
          unitsBox.innerHTML = "<p style='color:#94a3b8;font-size:12px;'>Aucune unité dans <code>live_positions</code>.</p>";
          return;
        }

        unitsBox.innerHTML = "";
        list.forEach((u) => {
          const div = document.createElement("div");
          div.className = "card" + (u.id === selectedId ? " selected" : "");
          const eq = u.equipment.length
            ? "<div class='tags'>" + u.equipment.map((e) => "<span class='tag'>" + esc(e) + "</span>").join("") + "</div>"
            : "";
          div.innerHTML = "<div class='card-head'><strong>" + esc(u.id) + "</strong><span class='badge st-" + u.status + "'>" + esc(u.label) + "</span></div><div class='meta'><span>" + u.speed.toFixed(1) + " km/h</span><span>" + (u.tracking ? "Actif" : "Arrêté") + "</span></div>" + eq;
          div.addEventListener("click", () => pickUnit(u.id, true));
          unitsBox.appendChild(div);
        });
      }

      onSnapshot(collection(db, "live_positions"), (snap) => {
        statusTxt.textContent = "En ligne";
        statusTxt.style.color = "#4ade80";
        const next = [];
        const seen = new Set();
        const bounds = [];

        snap.forEach((docSnap) => {
          const d = docSnap.data() || {};
          const id = String(d.unitId || docSnap.id);
          const st = normStatus(d.operationalStatus);
          const label = String(d.operationalStatusLabel || STATUS_LABELS[st]);
          const equipment = Array.isArray(d.equipment) ? d.equipment : [];
          const lat = typeof d.latitude === "number" ? d.latitude : null;
          const lng = typeof d.longitude === "number" ? d.longitude : null;
          const speed = typeof d.speedKmh === "number" ? d.speedKmh : 0;
          const tracking = Boolean(d.isTracking);

          seen.add(id);
          next.push({ id, status: st, label, equipment, lat, lng, speed, tracking });

          if (lat !== null && lng !== null && map && typeof L !== "undefined") {
            bounds.push([lat, lng]);
            const pop = "<div style='color:#0f172a;font-size:12px;'><strong>" + esc(id) + "</strong><br/>Statut : " + esc(label) + "<br/>Vitesse : " + speed.toFixed(1) + " km/h<br/>Matériel : " + (equipment.length ? esc(equipment.join(", ")) : "Aucun") + "</div>";
            const icon = makeIcon(id, st, label);
            if (markers.has(id)) {
              const m = markers.get(id);
              m.setLatLng([lat, lng]);
              m.setIcon(icon);
              m.setPopupContent(pop);
            } else {
              const m = L.marker([lat, lng], { icon }).addTo(map).bindPopup(pop).on("click", () => pickUnit(id, false));
              markers.set(id, m);
            }
          } else if (markers.has(id) && map) {
            map.removeLayer(markers.get(id));
            markers.delete(id);
          }
        });

        if (map) {
          markers.forEach((m, id) => {
            if (!seen.has(id)) { map.removeLayer(m); markers.delete(id); }
          });
        }

        units = next;
        renderUnits();
        if (!fittedOnce && bounds.length > 0 && map) {
          fittedOnce = true;
          map.fitBounds(bounds, { padding: [36, 36], maxZoom: 15 });
        }
      }, (err) => showErr("Firestore live_positions", err));

      onSnapshot(query(collection(db, "missions"), orderBy("createdAt", "desc"), limit(30)), (snap) => {
        missionsBox.innerHTML = "";
        snap.forEach((d) => {
          const m = d.data() || {};
          const el = document.createElement("div");
          el.className = "item";
          el.innerHTML = "<strong>" + esc(m.title || "Mission") + "</strong><div style='color:#94a3b8;margin-top:2px;'>Unité : " + esc(m.unitId || "Non affectée") + "</div>" + (m.notes ? "<div style='margin-top:3px;'>" + esc(m.notes) + "</div>" : "");
          missionsBox.appendChild(el);
        });
      }, () => {});

      onSnapshot(query(collection(db, "mci_logs"), orderBy("createdAt", "desc"), limit(50)), (snap) => {
        mciBox.innerHTML = "";
        snap.forEach((d) => {
          const x = d.data() || {};
          const dt = x.createdAt?.toDate ? x.createdAt.toDate().toLocaleTimeString("fr-FR") : "--:--:--";
          const el = document.createElement("div");
          el.className = "item";
          el.innerHTML = "<div class='time'>" + esc(dt) + (x.unitId ? " · " + esc(x.unitId) : "") + "</div><div>" + esc(x.message || "") + "</div>";
          mciBox.appendChild(el);
        });
      }, () => {});

      document.getElementById("f-dispatch").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = document.getElementById("m-title").value.trim();
        const unitId = mUnitSel.value.trim();
        const notes = document.getElementById("m-notes").value.trim();
        if (!title) return;
        await addDoc(collection(db, "missions"), { title, unitId, notes, status: "OUVERTE", createdAt: serverTimestamp() });
        await addDoc(collection(db, "mci_logs"), { unitId, message: "Dispatch : " + title + (unitId ? " -> " + unitId : "") + (notes ? " (" + notes + ")" : ""), createdAt: serverTimestamp() });
        e.target.reset();
      });

      document.getElementById("f-mci").addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = document.getElementById("c-msg").value.trim();
        if (!message) return;
        await addDoc(collection(db, "mci_logs"), { unitId: selectedId || "", message, createdAt: serverTimestamp() });
        e.target.reset();
      });

      document.getElementById("filters").addEventListener("click", (e) => {
        const b = e.target.closest(".fbtn");
        if (!b) return;
        filterCode = b.dataset.f;
        document.querySelectorAll(".fbtn").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        renderUnits();
      });

      document.getElementById("btn-trail").addEventListener("click", (e) => {
        trailOn = !trailOn;
        e.target.textContent = "Trajet : " + (trailOn ? "ON" : "OFF");
        startTrail(selectedId);
      });

      document.getElementById("btn-fit").addEventListener("click", () => {
        if (!map) return;
        const pts = units.filter((u) => typeof u.lat === "number" && typeof u.lng === "number").map((u) => [u.lat, u.lng]);
        if (pts.length > 0) map.fitBounds(pts, { padding: [36, 36], maxZoom: 15 });
      });
    } catch (e) {
      showErr("Chargement SDK", e);
    }
  </script>
</body>
</html>
