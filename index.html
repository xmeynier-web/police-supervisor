<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console Superviseur — Géolocalisation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      background: #f8fafc;
      color: #0f172a;
    }

    #sidebar {
      width: 340px;
      padding: 14px;
      overflow-y: auto;
      border-right: 1px solid #e2e8f0;
      background: #ffffff;
    }

    #sidebar h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    #map {
      flex: 1;
      height: 100%;
    }

    .unit-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .unit-card:hover {
      border-color: #94a3b8;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .equip-list {
      margin: 6px 0 0;
      padding-left: 18px;
      font-size: 13px;
      color: #334155;
    }

    .unit-divicon-root {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .unit-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .unit-label-box {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      white-space: nowrap;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28);
      pointer-events: none;
      line-height: 1.2;
    }

    .unit-label-name {
      font-size: 12px;
      font-weight: 700;
    }

    .unit-label-status {
      font-size: 10px;
      font-weight: 600;
      opacity: 0.92;
    }

    .status-PATROUILLE {
      background-color: #2563eb;
    }

    .status-INTERVENTION {
      background-color: #dc2626;
      transform: scale(1.12);
    }

    .status-DISPONIBLE {
      background-color: #16a34a;
    }

    .status-PAUSE {
      background-color: #d97706;
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>Unités actives</h2>
    <div id="units-list"></div>
  </aside>
  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCua2pik8r_B9bo8s-OqFQunFVPPwHbmCg",
      authDomain: "operator-supervisor-ops.firebaseapp.com",
      projectId: "operator-supervisor-ops",
      storageBucket: "operator-supervisor-ops.firebasestorage.app",
      messagingSenderId: "390289085067",
      appId: "1:390289085067:web:f6128eec4af06fb4143a8e"
    };

    const STATUS_CONFIG = {
      PATROUILLE: { label: "En patrouille", badgeBg: "#dbeafe", badgeFg: "#1d4ed8" },
      INTERVENTION: { label: "En intervention", badgeBg: "#fee2e2", badgeFg: "#b91c1c" },
      DISPONIBLE: { label: "Disponible", badgeBg: "#dcfce7", badgeFg: "#15803d" },
      PAUSE: { label: "En pause", badgeBg: "#fef3c7", badgeFg: "#b45309" }
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const map = L.map("map").setView([48.75, 2.33], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    const markers = new Map();
    const unitsListEl = document.getElementById("units-list");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&")
        .replaceAll("<", "<")
        .replaceAll(">", ">")
        .replaceAll('"', """);
    }

    function getStatusConfig(statusCode) {
      const normalized = String(statusCode || "PATROUILLE").toUpperCase();
      return STATUS_CONFIG[normalized] || STATUS_CONFIG.PATROUILLE;
    }

    function formatEquipment(equipment) {
      if (!Array.isArray(equipment) || equipment.length === 0) {
        return "<li>Aucun matériel signalé</li>";
      }
      return equipment.map((item) => `<li>${escapeHtml(item)}</li>`).join("");
    }

    function createLabeledStatusIcon(unitName, statusCode, statusLabel) {
      const normalized = String(statusCode || "PATROUILLE").toUpperCase();
      const safeClass = Object.prototype.hasOwnProperty.call(STATUS_CONFIG, normalized)
        ? `status-${normalized}`
        : "status-PATROUILLE";

      return L.divIcon({
        className: "",
        html: `
          <div class="unit-divicon-root">
            <div class="unit-marker ${safeClass}"></div>
            <div class="unit-label-box">
              <span class="unit-label-name">${escapeHtml(unitName)}</span>
              <span class="unit-label-status">${escapeHtml(statusLabel)}</span>
            </div>
          </div>
        `,
        iconSize: [22, 22],
        iconAnchor: [11, 11],
        popupAnchor: [0, -14]
      });
    }

    function renderSidebar(units) {
      unitsListEl.innerHTML = "";
      if (units.length === 0) {
        unitsListEl.innerHTML = "<p>Aucune unité active dans <code>live_positions</code>.</p>";
        return;
      }

      for (const unit of units) {
        const cfg = getStatusConfig(unit.operationalStatus);
        const card = document.createElement("div");
        card.className = "unit-card";
        card.innerHTML = `
          <div><strong>${escapeHtml(unit.unitName)}</strong> <small>(${escapeHtml(unit.unitId)})</small></div>
          <div style="margin-top:4px;">
            <span class="badge" style="background:${cfg.badgeBg};color:${cfg.badgeFg};">
              ${escapeHtml(unit.operationalStatusLabel)}
            </span>
          </div>
          ${unit.missionNote ? `<div style="margin-top:6px;font-size:13px;">Note : ${escapeHtml(unit.missionNote)}</div>` : ""}
          <ul class="equip-list">${formatEquipment(unit.equipment)}</ul>
        `;
        card.addEventListener("click", () => {
          if (typeof unit.latitude === "number" && typeof unit.longitude === "number") {
            map.setView([unit.latitude, unit.longitude], 16);
            markers.get(unit.unitId)?.openPopup();
          }
        });
        unitsListEl.appendChild(card);
      }
    }

    onSnapshot(collection(db, "live_positions"), (snapshot) => {
      const units = [];
      const seenUnitIds = new Set();

      snapshot.forEach((docSnap) => {
        const data = docSnap.data() || {};
        const unitId = String(data.unitId || docSnap.id);
        const unitName = String(data.unitName || unitId);
        const operationalStatus = String(data.operationalStatus || "PATROUILLE").toUpperCase();
        const cfg = getStatusConfig(operationalStatus);
        const operationalStatusLabel = String(data.operationalStatusLabel || cfg.label);
        const equipment = Array.isArray(data.equipment) ? data.equipment : [];
        const missionNote = typeof data.missionNote === "string" ? data.missionNote : "";
        const lat = typeof data.latitude === "number" ? data.latitude : null;
        const lng = typeof data.longitude === "number" ? data.longitude : null;
        const speedKmh = typeof data.speedKmh === "number" ? data.speedKmh.toFixed(1) : "0.0";

        seenUnitIds.add(unitId);
        units.push({
          unitId,
          unitName,
          operationalStatus,
          operationalStatusLabel,
          equipment,
          missionNote,
          latitude: lat,
          longitude: lng
        });

        if (lat !== null && lng !== null) {
          const popupHtml = `
            <div>
              <strong>${escapeHtml(unitName)}</strong> (${escapeHtml(unitId)})<br/>
              <strong>Statut :</strong> ${escapeHtml(operationalStatusLabel)}<br/>
              <strong>Vitesse :</strong> ${speedKmh} km/h<br/>
              ${missionNote ? `<strong>Note :</strong> ${escapeHtml(missionNote)}<br/>` : ""}
              <strong>Matériel :</strong>
              <ul class="equip-list">${formatEquipment(equipment)}</ul>
            </div>
          `;
          const icon = createLabeledStatusIcon(unitName, operationalStatus, operationalStatusLabel);

          if (markers.has(unitId)) {
            const marker = markers.get(unitId);
            marker.setLatLng([lat, lng]);
            marker.setIcon(icon);
            marker.setPopupContent(popupHtml);
          } else {
            const marker = L.marker([lat, lng], { icon })
              .addTo(map)
              .bindPopup(popupHtml);
            markers.set(unitId, marker);
          }
        } else if (markers.has(unitId)) {
          map.removeLayer(markers.get(unitId));
          markers.delete(unitId);
        }
      });

      for (const [existingId, marker] of markers.entries()) {
        if (!seenUnitIds.has(existingId))
