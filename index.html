<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Police Supervisor CSU — operator-supervisor-ops</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #162032;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --patrouille: #2563eb;
      --intervention: #dc2626;
      --disponible: #16a34a;
      --pause: #d97706;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: 54px 1fr;
      overflow: hidden;
    }

    header {
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .pill-project {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-family: monospace;
    }

    .header-stats {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .header-stats strong { color: var(--text); }

    .workspace {
      display: grid;
      grid-template-columns: 340px 1fr 360px;
      height: calc(100vh - 54px);
      overflow: hidden;
    }

    aside, section.right-pane {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    section.right-pane {
      border-right: none;
      border-left: 1px solid var(--border);
    }

    .pane-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
    }

    .filter-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
      font-weight: 700;
    }

    .scroll-list {
      padding: 10px 12px;
      overflow-y: auto;
      flex: 1;
    }

    .unit-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .unit-card:hover { border-color: var(--accent); }
    .unit-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .unit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
