        #left-panel { width: 320px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 16px; overflow-y: auto; flex-shrink: 0; }

        input::placeholder { color: var(--text-muted); }
        input:focus, select:focus { outline: none; border-color: var(--orange-btn); }

        button.btn-orange { width: 100%; background-color: var(--orange-btn); color: #ffffff; border: none; padding: 10px; font-weight: 700; font-size: 12px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button.btn-orange:hover { background-color: var(--orange-btn-hover); }

        .units-list { display: flex; flex-direction: column; gap: 8px; }
        .unit-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .unit-card .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--green-card); display: inline-block; margin-right: 6px; }

        #map { width: 100%; height: 100%; }
