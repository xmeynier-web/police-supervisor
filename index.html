<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console Superviseur — police-supervisor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #162032;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --patrouille: #2563eb;
      --intervention: #dc2626;
      --disponible: #16a34a;
      --pause: #d97706;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: 54px 1fr;
      overflow: hidden;
    }

    header {
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .pill-project {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-family: monospace;
    }

    .header-stats {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .header-stats strong { color: var(--text); }

    .workspace {
      display: grid;
      grid-template-columns: 340px 1fr 360px;
      height: calc(100vh - 54px);
      overflow: hidden;
    }

    aside, section.right-pane {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    section.right-pane {
      border-right: none;
      border-left: 1px solid var(--border);
    }

    .pane-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
    }

    .filter-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
      font-weight: 700;
    }

    .scroll-list {
      padding: 10px 12px;
      overflow-y: auto;
      flex: 1;
    }

    .unit-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .unit-card:hover { border-color: var(--accent); }
    .unit-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .unit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .bg-PATROUILLE { background: var(--patrouille); }
    .bg-INTERVENTION { background: var(--intervention); }
    .bg-DISPONIBLE { background: var(--disponible); }
    .bg-PAUSE { background: var(--pause); }

    .unit-meta {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .equip-tags {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .equip-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(148, 163, 184, 0.14);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .map-wrap {
      position: relative;
      height: 100%;
      width: 100%;
      background: #1e293b;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .map-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 500;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .btn {
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .right-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
    }

    .tab-btn {
      padding: 10px;
      background: transparent;
      color: var(--muted);
      border: none;
      border-bottom: 2px solid transparent;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      height: calc(100% - 39px);
      overflow: hidden;
    }

    .tab-panel.active { display: flex; }

    form.dispatch-form {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      display: grid;
      gap: 8px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
    }

    .mission-item, .mci-entry {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .mci-time {
      color: var(--accent);
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .unit-divicon-root {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .unit-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .unit-label-box {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      white-space: nowrap;
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      pointer-events: none;
      line-height: 1.2;
    }

    .unit-label-name { font-size: 12px; font-weight: 700; }
    .unit-label-status { font-size: 10px; color: #cbd5e1; }

    .status-PATROUILLE { background-color: var(--patrouille); }
    .status-INTERVENTION { background-color: var(--intervention); }
    .status-DISPONIBLE { background-color: var(--disponible); }
    .status-PAUSE { background-color: var(--pause); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>Console Superviseur</span>
      <span class="pill-project">operator-supervisor-ops</span>
    </div>
    <div class="header-stats">
      <span>Unités suivies : <strong id="stat-total">0</strong></span>
      <span>En intervention : <strong id="stat-interv">0</strong></span>
      <span id="sync-indicator">Initialisation...</span>
    </div>
  </header>

  <div class="workspace">
    <aside>
      <div class="pane-header">
        <span>Unités opérationnelles</span>
        <span id="selected-unit-badge" style="font-size:11px;color:var(--accent);">Aucune sélection</span>
      </div>
      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="ALL">Tous</button>
        <button class="filter-btn" data-filter="PATROUILLE">Patrouille</button>
        <button class="filter-btn" data-filter="INTERVENTION">Intervention</button>
        <button class="filter-btn" data-filter="DISPONIBLE">Disponible</button>
        <button class="filter-btn" data-filter="PAUSE">Pause</button>
      </div>
      <div class="scroll-list" id="units-list">
        <p style="color:var(--muted);font-size:13px;">Chargement des unités...</p>
      </div>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div class="map-toolbar">
        <button class="btn secondary" id="btn-toggle-history">Trajet unité : OFF</button>
        <button class="btn secondary" id="btn-center-all">Recentrer</button>
      </div>
    </main>

    <section class="right-pane">
      <div class="right-tabs">
        <button class="tab-btn active" data-tab="dispatch">Dispatch</button>
        <button class="tab-btn" data-tab="mci">Main-courante (MCI)</button>
      </div>

      <div class="tab-panel active" id="panel-dispatch">
        <form class="dispatch-form" id="dispatch-form">
          <input type="text" id="mission-title" placeholder="Intitulé de mission / intervention" required />
          <select id="mission-unit">
            <option value="">Unité à affecter (optionnel)</option>
          </select>
          <textarea id="mission-notes" rows="2" placeholder="Lieu, consignes, précision..."></textarea>
          <button type="submit" class="btn">Créer & consigner au MCI</button>
        </form>
        <div class="scroll-list" id="missions-list"></div>
      </div>

      <div class="tab-panel" id="panel-mci">
        <form class="dispatch-form" id="mci-form">
          <input type="text" id="mci-text" placeholder="Nouvelle mention de main-courante..." required />
          <button type="submit" class="btn">Ajouter au registre</button>
        </form>
        <div class="scroll-list" id="mci-list"></div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    const syncIndicatorEl = document.getElementById("sync-indicator");
    const unitsListEl = document.getElementById("units-list");

    function showFatalError(msg) {
      syncIndicatorEl.textContent = "Erreur";
      syncIndicatorEl.style.color = "#f87171";
      unitsListEl.innerHTML = `<p style="color:#f87171;font-size:12px;">${msg}</p>`;
    }

    window.addEventListener("error", (ev) => {
      showFatalError(ev.message || "Erreur script");
    });
    window.addEventListener("unhandledrejection", (ev) => {
      showFatalError(ev.reason?.message || "Erreur promesse");
    });

    if (typeof L === "undefined") {
      showFatalError("Leaflet n'a pas pu être chargé (vérifier l'accès réseau à unpkg.com).");
    }

    const map = L.map("map").setView([48.75, 2.33], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);
    setTimeout(() => map.invalidateSize(), 200);

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      limit,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCua2pik8r_B9bo8s-OqFQunFVPPwHbmCg",
      authDomain: "operator-supervisor-ops.firebaseapp.com",
      projectId: "operator-supervisor-ops",
      storageBucket: "operator-supervisor-ops.firebasestorage.app",
      messagingSenderId: "390289085067",
      appId: "1:390289085067:web:f6128eec4af06fb4143a8e"
    };

    const STATUS_CONFIG = {
      PATROUILLE: { label: "En patrouille" },
      INTERVENTION: { label: "En intervention" },
      DISPONIBLE: { label: "Disponible" },
      PAUSE: { label: "En pause" }
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const markers = new Map();
    let allUnits = [];
    let currentFilter = "ALL";
    let selectedUnitId = null;
    let showHistoryTrail = false;
    let historyPolyline = null;
    let unsubscribeHistory = null;

    const missionsListEl = document.getElementById("missions-list");
    const mciListEl = document.getElementById("mci-list");
    const missionUnitSelectEl = document.getElementById("mission-unit");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&")
        .replaceAll("<", "<")
        .replaceAll(">", ">")
        .replaceAll('"', """);
    }

    function normalizeStatus(code) {
      const upper = String(code || "PATROUILLE").toUpperCase();
      return Object.prototype.hasOwnProperty.call(STATUS_CONFIG, upper) ? upper : "PATROUILLE";
    }

    function createLabeledStatusIcon(unitName, statusCode, statusLabel) {
      const st = normalizeStatus(statusCode);
      return L.divIcon({
        className: "",
        html: `
          <div class="unit-divicon-root">
            <div class="unit-marker status-${st}"></div>
            <div class="unit-label-box">
              <span class="unit-label-name">${escapeHtml(unitName)}</span>
              <span class="unit-label-status">${escapeHtml(statusLabel)}</span>
            </div>
          </div>
        `,
        iconSize: [22, 22],
        iconAnchor: [11, 11],
        popupAnchor: [0, -14]
      });
    }

    function clearHistoryListener() {
      if (unsubscribeHistory) {
        unsubscribeHistory();
        unsubscribeHistory = null;
      }
      if (historyPolyline) {
        map.removeLayer(historyPolyline);
        historyPolyline = null;
      }
    }

    function bindHistoryTrail(unitId) {
      clearHistoryListener();
      if (!showHistoryTrail || !unitId) return;

      const histQuery = query(
        collection(db, "live_positions", unitId, "history"),
        orderBy("updatedAt", "desc"),
        limit(50)
      );

      unsubscribeHistory = onSnapshot(histQuery, (snap) => {
        const pts = [];
        snap.forEach((docItem) => {
          const d = docItem.data() || {};
          if (typeof d.latitude === "number" && typeof d.longitude === "number") {
            pts.push([d.latitude, d.longitude]);
          }
        });
        pts.reverse();
        if (historyPolyline) map.removeLayer(historyPolyline);
        if (pts.length > 1) {
          historyPolyline = L.polyline(pts, { color: "#38bdf8", weight: 3, dashArray: "6,6" }).addTo(map);
        }
      }, () => {});
    }

    function selectUnit(unitId, centerMap = true) {
      selectedUnitId = unitId;
      document.getElementById("selected-unit-badge").textContent = unitId || "Aucune sélection";
      const unit = allUnits.find((u) => u.unitId === unitId);
      if (unit && centerMap && typeof unit.latitude === "number" && typeof unit.longitude === "number") {
        map.setView([unit.latitude, unit.longitude], 16);
        markers.get(unitId)?.openPopup();
      }
      bindHistoryTrail(unitId);
      renderUnitsList();
    }

    function renderUnitsList() {
      const filtered = currentFilter === "ALL"
        ? allUnits
        : allUnits.filter((u) => u.operationalStatus === currentFilter);

      document.getElementById("stat-total").textContent = String(allUnits.length);
      document.getElementById("stat-interv").textContent = String(
        allUnits.filter((u) => u.operationalStatus === "INTERVENTION").length
      );

      const previousSelection = missionUnitSelectEl.value;
      missionUnitSelectEl.innerHTML = `<option value="">Unité à affecter (optionnel)</option>`;
      for (const u of allUnits) {
        const opt = document.createElement("option");
        opt.value = u.unitId;
        opt.textContent = `${u.unitName} (${u.unitId})`;
        missionUnitSelectEl.appendChild(opt);
      }
      if (previousSelection) missionUnitSelectEl.value = previousSelection;

      unitsListEl.innerHTML = "";
      if (filtered.length === 0) {
        unitsListEl.innerHTML = `<p style="color:var(--muted);font-size:13px;">Aucune unité dans <code>live_positions</code> pour ce filtre.</p>`;
        return;
      }

      for (const unit of filtered) {
        const card = document.createElement("div");
        card.className = `unit-card ${unit.unitId === selectedUnitId ? "selected" : ""}`;
        const equipHtml = unit.equipment.length
          ? `<div class="equip-tags">${unit.equipment.map((eq) => `<span class="equip-tag">${escapeHtml(eq)}</span>`).join("")}</div>`
          : "";

        card.innerHTML = `
          <div class="unit-top">
            <div><strong>${escapeHtml(unit.unitName)}</strong> <small style="color:var(--muted);">(${escapeHtml(unit.unitId)})</small></div>
            <span class="badge bg-${unit.operationalStatus}">${escapeHtml(unit.operationalStatusLabel)}</span>
          </div>
          <div class="unit-meta">
            <span>${unit.speedKmh.toFixed(1)} km/h</span>
            <span>${unit.isTracking ? "Actif" : "Arrêté"}</span>
          </div>
          ${unit.missionNote ? `<div style="margin-top:6px;font-size:12px;color:#cbd5e1;">${escapeHtml(unit.missionNote)}</div>` : ""}
          ${equipHtml}
        `;
        card.addEventListener("click", () => selectUnit(unit.unitId, true));
        unitsListEl.appendChild(card);
      }
    }

    onSnapshot(collection(db, "live_positions"), (snapshot) => {
      syncIndicatorEl.textContent = "Firestore synchronisé";
      syncIndicatorEl.style.color = "#4ade80";
      const nextUnits = [];
      const seenIds = new Set();

      snapshot.forEach((docSnap) => {
        const data = docSnap.data() || {};
        const unitId = String(data.unitId || docSnap.id);
        const unitName = String(data.unitName || unitId);
        const operationalStatus = normalizeStatus(data.operationalStatus);
        const operationalStatusLabel = String(data.operationalStatusLabel || STATUS_CONFIG[operationalStatus].label);
        const equipment = Array.isArray(data.equipment) ? data.equipment : [];
        const missionNote = typeof data.missionNote === "string" ? data.missionNote : "";
        const lat = typeof data.latitude === "number" ? data.latitude : null;
        const lng = typeof data.longitude === "number" ? data.longitude : null;
        const speedKmh = typeof data.speedKmh === "number" ? data.speedKmh : 0;
        const isTracking = Boolean(data.isTracking);

        seenIds.add(unitId);
        nextUnits.push({
          unitId,
          unitName,
          operationalStatus,
          operationalStatusLabel,
          equipment,
          missionNote,
          latitude: lat,
          longitude: lng,
          speedKmh,
          isTracking
        });

        if (lat !== null && lng !== null) {
          const popupHtml = `
            <div style="color:#0f172a;font-size:13px;">
              <strong>${escapeHtml(unitName)}</strong> (${escapeHtml(unitId)})<br/>
              <strong>Statut :</strong> ${escapeHtml(operationalStatusLabel)}<br/>
              <strong>Vitesse :</strong> ${speedKmh.toFixed(1)} km/h<br/>
              ${missionNote ? `<strong>Note :</strong> ${escapeHtml(missionNote)}<br/>` : ""}
              <strong>Matériel :</strong> ${equipment.length ? escapeHtml(equipment.join(", ")) : "Aucun"}
            </div>
          `;
          const icon = createLabeledStatusIcon(unitName, operationalStatus, operationalStatusLabel);

          if (markers.has(unitId)) {
            const m = markers.get(unitId);
            m.setLatLng([lat, lng]);
            m.setIcon(icon);
            m.setPopupContent(popupHtml);
          } else {
            const m = L.marker([lat, lng], { icon })
              .addTo(map)
              .bindPopup(popupHtml)
              .on("click", () => selectUnit(unitId, false));
            markers.set(unitId, m);
          }
        } else if (markers.has(unitId)) {
          map.removeLayer(markers.get(unitId));
          markers.delete(unitId);
        }
      });

      for (const [id, marker] of markers.entries()) {
        if (!seenIds.has(id)) {
          map.removeLayer(marker);
          markers.delete(id);
        }
      }

      allUnits = nextUnits;
      renderUnitsList();
    }, (err) => {
      showFatalError(`Firestore : ${err.message || err.code}`);
      console.error(err);
    });

    onSnapshot(query(collection(db, "missions"), orderBy("createdAt", "desc"), limit(30)), (snap) => {
      missionsListEl.innerHTML = "";
      snap.forEach((d) => {
        const m = d.data() || {};
        const el = document.createElement("div");
        el.className = "mission-item";
        el.innerHTML = `
          <div><strong>${escapeHtml(m.title || "Mission")}</strong></div>
          <div style="color:var(--muted);margin-top:3px;">Unité : ${escapeHtml(m.unitId || "Non affectée")}</div>
          ${m.notes ? `<div style="margin-top:4px;">${escapeHtml(m.notes)}</div>` : ""}
        `;
        missionsListEl.appendChild(el);
      });
    }, () => {});

    onSnapshot(query(collection(db, "mci_logs"), orderBy("createdAt", "desc"), limit(50)), (snap) => {
      mciListEl.innerHTML = "";
      snap.forEach((d) => {
        const entry = d.data() || {};
        const dateObj = entry.createdAt?.toDate ? entry.createdAt.toDate() : null;
        const timeStr = dateObj ? dateObj.toLocaleTimeString("fr-FR") : "--:--:--";
        const el = document.createElement("div");
        el.className = "mci-entry";
        el.innerHTML = `
          <div class="mci-time">${escapeHtml(timeStr)} ${entry.unitId ? `· ${escapeHtml(entry.unitId)}` : ""}</div>
          <div>${escapeHtml(entry.message || "")}</div>
        `;
        mciListEl.appendChild(el);
      });
    }, () => {});

    document.getElementById("dispatch-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("mission-title").value.trim();
      const unitId = document.getElementById("mission-unit").value.trim();
      const notes = document.getElementById("mission-notes").value.trim();
      if (!title) return;

      await addDoc(collection(db, "missions"), {
        title,
        unitId,
        notes,
        status: "OUVERTE",
        createdAt: serverTimestamp()
      });

      await addDoc(collection(db, "mci_logs"), {
        unitId,
        message: `Dispatch : ${title}${unitId ? ` -> ${unitId}` : ""}${notes ? ` (${notes})` : ""}`,
        createdAt: serverTimestamp()
      });

      e.target.reset();
    });

    document.getElementById("mci-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = document.getElementById("mci-text").value.trim();
      if (!message) return;

      await addDoc(collection(db, "mci_logs"), {
        unitId: selectedUnitId || "",
        message,
        createdAt: serverTimestamp()
      });

      e.target.reset();
    });

    document.getElementById("filter-bar").addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      currentFilter = btn.dataset.filter;
      document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      renderUnitsList();
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
      });
    });

    document.getElementById("btn-toggle-history").addEventListener("click", (e) => {
      showHistoryTrail = !showHistoryTrail;
      e.target.textContent = `Trajet unité : ${showHistoryTrail ? "ON" : "OFF"}`;
      bindHistoryTrail(selectedUnitId);
    });

    document.getElementById("btn-center-all").addEventListener("click", () => {
      const coords = allUnits
        .filter((u) => typeof u.latitude === "number" && typeof u.longitude === "number")
        .map((u) => [u.latitude, u.longitude]);
      if (coords.length > 0) {
        map.fitBounds(coords, { padding: [36, 36], maxZoom: 15 });
      }
    });
  </script>
</body>
</html>
