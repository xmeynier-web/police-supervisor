<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supervision / Poste de Commandement</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 52px;
      background: #162032;
      border-bottom: 1px solid #334155;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .pill {
      font-family: monospace;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .stats { display: flex; align-items: center; gap: 14px; font-size: 13px; color: #94a3b8; }
    .stats strong { color: #f8fafc; }
    .sound-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .sound-btn.on {
      border-color: #22c55e;
      color: #4ade80;
    }

    @keyframes sosBannerPulse {
      0%, 100% { background: #dc2626; border-color: #ffffff; }
      50% { background: #7f1d1d; border-color: #fca5a5; }
    }
    @keyframes sosCardFlash {
      0%, 100% {
        background: rgba(220, 38, 38, 0.85);
        border-color: #ffffff;
        box-shadow: 0 0 18px rgba(239, 68, 68, 0.9);
      }
      50% {
        background: rgba(127, 29, 29, 0.45);
        border-color: #ef4444;
        box-shadow: 0 0 4px rgba(239, 68, 68, 0.3);
      }
    }
    @keyframes sosMarkerPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.95), 0 0 12px #ef4444;
        transform: scale(1.15);
      }
      70% {
        box-shadow: 0 0 0 18px rgba(239, 68, 68, 0), 0 0 18px #ef4444;
        transform: scale(1.3);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0), 0 0 12px #ef4444;
        transform: scale(1.15);
      }
    }

    .sos-banner {
      display: none;
      padding: 10px 16px;
      border-bottom: 2px solid #ffffff;
      color: #ffffff;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: sosBannerPulse 0.8s infinite;
      flex-shrink: 0;
    }
    .sos-banner.active {
      display: flex;
    }
    .sos-banner-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sos-banner-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }
    .sos-banner-addr {
      font-size: 12px;
      font-weight: 600;
      color: #fef2f2;
    }
    .sos-banner-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .sos-btn-action {
      background: #0f172a;
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .main-layout { flex: 1; display: flex; min-height: 0; width: 100%; }
    .col-left {
      width: 280px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .col-map { flex: 1; position: relative; background: #1e293b; min-width: 0; }
    #map { width: 100%; height: 100%; }
    .col-right {
      width: 295px;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .pane-title {
      padding: 10px 10px;
      background: #162032;
      border-bottom: 1px solid #334155;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .filters {
      padding: 8px 8px;
      background: #162032;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .fbtn {
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
    }
    .fbtn.active {
      background: #38bdf8;
      color: #082f49;
      border-color: #38bdf8;
      font-weight: 700;
    }
    .scroll { flex: 1; overflow-y: auto; padding: 8px; }

    .card {
      background: #162032;
      border: 1px solid #334155;
      border-left-width: 6px;
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }
    .card:hover { transform: translateX(2px); }
    .card.hi-PATROUILLE {
      border-left-color: #2563eb;
      border-color: rgba(37, 99, 235, 0.58);
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.36) 0%, rgba(37, 99, 235, 0.12) 55%, #162032 100%);
    }
    .card.hi-INTERVENTION {
      border-left-color: #dc2626;
      border-color: rgba(220, 38, 38, 0.65);
      background: linear-gradient(90deg, rgba(220, 38, 38, 0.42) 0%, rgba(220, 38, 38, 0.14) 55%, #162032 100%);
    }
    .card.hi-SUR_LIEUX {
      border-left-color: #8b5cf6;
      border-color: rgba(139, 92, 246, 0.65);
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.38) 0%, rgba(139, 92, 246, 0.14) 55%, #162032 100%);
    }
    .card.hi-CONTROLE_ROUTE {
      border-left-color: #06b6d4;
      border-color: rgba(6, 182, 212, 0.65);
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.38) 0%, rgba(6, 182, 212, 0.14) 55%, #162032 100%);
    }
    .card.hi-DISPONIBLE {
      border-left-color: #16a34a;
      border-color: rgba(22, 163, 74, 0.58);
      background: linear-gradient(90deg, rgba(22, 163, 74, 0.36) 0%, rgba(22, 163, 74, 0.12) 55%, #162032 100%);
    }
    .card.hi-PAUSE {
      border-left-color: #d97706;
      border-color: rgba(217, 119, 6, 0.62);
      background: linear-gradient(90deg, rgba(217, 119, 6, 0.38) 0%, rgba(217, 119, 6, 0.13) 55%, #162032 100%);
    }
    .card.hi-FIN_DE_SERVICE {
      border-left-color: #475569;
      border-color: rgba(71, 85, 105, 0.68);
      background: linear-gradient(90deg, rgba(71, 85, 105, 0.38) 0%, rgba(71, 85, 105, 0.14) 55%, #162032 100%);
    }
    .card.sos-alert-card {
      border-left-color: #ffffff;
      animation: sosCardFlash 0.7s infinite;
    }
    .card.selected {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px #38bdf8, 0 6px 14px rgba(0, 0, 0, 0.45);
    }

    .sos-card-box {
      margin-top: 6px;
      padding: 5px 7px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #ffffff;
      color: #fef2f2;
      font-size: 11px;
      font-weight: 700;
    }

    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    .unit-title-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .crew-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      white-space: nowrap;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      color: #fff;
      white-space: nowrap;
    }
    .st-PATROUILLE { background: #2563eb; color: #fff; }
    .st-INTERVENTION { background: #dc2626; color: #fff; }
    .st-SUR_LIEUX { background: #8b5cf6; color: #fff; }
    .st-CONTROLE_ROUTE { background: #06b6d4; color: #082f49; }
    .st-DISPONIBLE { background: #16a34a; color: #fff; }
    .st-PAUSE { background: #d97706; color: #fff; }
    .st-FIN_DE_SERVICE { background: #475569; color: #f8fafc; }
    .st-SOS { background: #dc2626; color: #ffffff; border: 1px solid #ffffff; }

    .meta { margin-top: 5px; font-size: 11px; color: #e2e8f0; display: flex; justify-content: space-between; }
    .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { font-size: 10px; padding: 2px 6px; border-radius: 5px; background: rgba(15, 23, 42, 0.72); border: 1px solid #475569; }
    .toolbar {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 500;
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .btn {
      background: #38bdf8;
      color: #082f49;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.sec { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    .tabs { display: flex; background: #162032; border-bottom: 1px solid #334155; }
    .tbtn {
      flex: 1;
      padding: 9px 6px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #94a3b8;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }
    .tbtn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    .panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .panel.active { display: flex; }
    form.box {
      padding: 8px;
      background: #162032;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    input, select, textarea {
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
    }
    .mci-filters {
      display: flex;
      gap: 4px;
      padding: 6px 8px;
      background: #162032;
      border-bottom: 1px solid #334155;
    }
    .mci-fbtn {
      flex: 1;
      padding: 4px 4px;
      font-size: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
    }
    .mci-fbtn.active {
      background: #38bdf8;
      color: #082f49;
      border-color: #38bdf8;
      font-weight: 700;
    }
    .item {
      background: #162032;
      border: 1px solid #334155;
      border-left: 4px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .item.mci-st-PATROUILLE {
      border-left-color: #2563eb;
      border-color: rgba(37, 99, 235, 0.58);
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.34) 0%, #162032 80%);
    }
    .item.mci-st-INTERVENTION {
      border-left-color: #dc2626;
      border-color: rgba(220, 38, 38, 0.65);
      background: linear-gradient(90deg, rgba(220, 38, 38, 0.38) 0%, #162032 80%);
    }
    .item.mci-st-SUR_LIEUX {
      border-left-color: #8b5cf6;
      border-color: rgba(139, 92, 246, 0.65);
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.36) 0%, #162032 80%);
    }
    .item.mci-st-CONTROLE_ROUTE {
      border-left-color: #06b6d4;
      border-color: rgba(6, 182, 212, 0.65);
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.36) 0%, #162032 80%);
    }
    .item.mci-st-DISPONIBLE {
      border-left-color: #16a34a;
      border-color: rgba(22, 163, 74, 0.58);
      background: linear-gradient(90deg, rgba(22, 163, 74, 0.34) 0%, #162032 80%);
    }
    .item.mci-st-PAUSE {
      border-left-color: #d97706;
      border-color: rgba(217, 119, 6, 0.62);
      background: linear-gradient(90deg, rgba(217, 119, 6, 0.36) 0%, #162032 80%);
    }
    .item.mci-st-FIN_DE_SERVICE {
      border-left-color: #475569;
      border-color: rgba(71, 85, 105, 0.68);
      background: linear-gradient(90deg, rgba(71, 85, 105, 0.38) 0%, #162032 80%);
    }
    .item.sos-log {
      border-left-color: #ffffff;
      border-color: #ef4444;
      background: linear-gradient(90deg, rgba(220, 38, 38, 0.58) 0%, rgba(127, 29, 29, 0.35) 70%, #162032 100%);
      font-weight: 700;
    }
    .item.ack-log {
      border-left-color: #16a34a;
      background: linear-gradient(90deg, rgba(22, 163, 74, 0.24) 0%, #162032 80%);
    }
    .item.archive-log {
      border-left-color: #d97706;
      background: linear-gradient(90deg, rgba(217, 119, 6, 0.24) 0%, #162032 80%);
    }
    .mission-actions {
      margin-top: 7px;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }
    .btn-archive {
      background: #d97706;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      padding: 4px 9px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-archive:hover {
      background: #b45309;
    }
    .mci-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      margin-bottom: 3px;
    }
    .mci-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .time { color: #38bdf8; font-family: monospace; font-size: 10px; }
    .marker-wrap { position: relative; width: 22px; height: 22px; }
    .marker-dot {
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.45);
    }
    .marker-dot.sos-marker-dot {
      background: #ef4444;
      border: 3px solid #ffffff;
      animation: sosMarkerPulse 0.75s infinite;
    }
    .marker-tag {
      position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.92); color: #fff; padding: 2px 7px;
      border-radius: 5px; font-size: 11px; font-weight: 700; white-space: nowrap;
      pointer-events: none; text-align: center;
    }
    .marker-tag.sos-marker-tag {
      background: #dc2626;
      border: 1px solid #ffffff;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.85);
    }
    .marker-sub { display: block; font-size: 10px; font-weight: 500; color: #cbd5e1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>Supervision / Poste de Commandement</span>
      <span class="pill">operator-supervisor-ops</span>
    </div>
    <div class="stats">
      <span>Unités : <strong id="cnt-all">0</strong></span>
      <span>Effectif : <strong id="cnt-crew">0</strong></span>
      <span>Intervention : <strong id="cnt-int">0</strong></span>
      <button type="button" class="sound-btn" id="btn-sound">Son : Activer</button>
      <span id="status-txt">Chargement...</span>
    </div>
  </header>

  <div class="sos-banner" id="sos-banner">
    <div class="sos-banner-info">
      <div class="sos-banner-title" id="sos-banner-title">ALERTE SOS</div>
      <div class="sos-banner-addr" id="sos-banner-addr">Adresse en cours...</div>
    </div>
    <div class="sos-banner-actions">
      <button type="button" class="sos-btn-action" id="btn-sos-zoom">Localiser</button>
      <button type="button" class="sos-btn-action" id="btn-sos-mute">Couper sirène</button>
      <button type="button" class="sos-btn-action" id="btn-sos-ack">Acquitter SOS</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="col-left">
      <div class="pane-title">
        <span>Unités</span>
        <span id="sel-txt" style="color:#38bdf8;font-size:11px;">Aucune</span>
      </div>
      <div class="filters" id="filters">
        <button class="fbtn active" data-f="ALL">Tous</button>
        <button class="fbtn" data-f="PATROUILLE">Patrouille</button>
        <button class="fbtn" data-f="INTERVENTION">Intervention</button>
        <button class="fbtn" data-f="SUR_LIEUX">Sur les lieux</button>
        <button class="fbtn" data-f="CONTROLE_ROUTE">Contrôle route</button>
        <button class="fbtn" data-f="DISPONIBLE">Disponible</button>
        <button class="fbtn" data-f="PAUSE">Pause</button>
        <button class="fbtn" data-f="FIN_DE_SERVICE">Fin de service</button>
      </div>
      <div class="scroll" id="units-box"></div>
    </div>

    <div class="col-map">
      <div id="map"></div>
      <div class="toolbar">
        <button class="btn sec" id="btn-trail">Trajet : OFF</button>
        <button class="btn sec" id="btn-fit">Recentrer</button>
      </div>
    </div>

    <div class="col-right">
      <div class="tabs">
        <button class="tbtn active" data-p="dispatch">Dispatch</button>
        <button class="tbtn" data-p="mci">Main-courante</button>
      </div>
      <div class="panel active" id="p-dispatch">
        <form class="box" id="f-dispatch">
          <select id="m-unit"><option value="">1. Unité (optionnel)</option></select>
          <input type="text" id="m-title" placeholder="2. Intitulé de mission" required />
          <textarea id="m-notes" rows="2" placeholder="3. Lieux / consignes / adresses"></textarea>
          <button type="submit" class="btn">Dispatcher & MCI</button>
        </form>
        <div class="scroll" id="missions-box"></div>
      </div>
      <div class="panel" id="p-mci">
        <div class="mci-filters" id="mci-filters">
          <button class="mci-fbtn active" data-mf="ALL">Tout</button>
          <button class="mci-fbtn" data-mf="SOS">SOS</button>
          <button class="mci-fbtn" data-mf="STATUS">Statuts</button>
          <button class="mci-fbtn" data-mf="DISPATCH">Dispatch</button>
        </div>
        <form class="box" id="f-mci">
          <input type="text" id="c-msg" placeholder="Mention main-courante..." required />
          <button type="submit" class="btn">Enregistrer MCI</button>
        </form>
        <div class="scroll" id="mci-box"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    window.supMap = null;
    if (typeof L !== "undefined") {
      window.supMap = L.map("map").setView([48.6918631, 2.3108942], 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }).addTo(window.supMap);
      new ResizeObserver(function () {
        if (window.supMap) window.supMap.invalidateSize();
      }).observe(document.getElementById("map"));
      setTimeout(function () {
        if (window.supMap) window.supMap.invalidateSize();
      }, 150);
    }

    document.querySelectorAll(".tbtn").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll(".tbtn").forEach(function (x) { x.classList.remove("active"); });
        document.querySelectorAll(".panel").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        document.getElementById("p-" + b.dataset.p).classList.add("active");
        setTimeout(function () {
          if (window.supMap) window.supMap.invalidateSize();
        }, 60);
      });
    });

    setTimeout(function () {
      var st = document.getElementById("status-txt");
      var box = document.getElementById("units-box");
      if (st && st.textContent === "Chargement...") {
        st.textContent = "Timeout / Bloqué";
        st.style.color = "#f87171";
        if (box && !box.hasChildNodes()) {
          var p = document.createElement("p");
          p.style.color = "#f87171";
          p.style.fontSize = "12px";
          p.textContent = "Aucune réponse Firestore après 5s. Vérifiez la console (F12) et les règles Firestore.";
          box.appendChild(p);
        }
      }
    }, 5000);
  </script>

  <script type="module">
    const statusTxt = document.getElementById("status-txt");
    const unitsBox = document.getElementById("units-box");

    function showErr(label, e) {
      if (statusTxt) {
        statusTxt.textContent = "Erreur";
        statusTxt.style.color = "#f87171";
      }
      if (unitsBox) {
        unitsBox.textContent = "";
        const p = document.createElement("p");
        p.style.color = "#f87171";
        p.style.fontSize = "12px";
        p.textContent = `${label} : ${String(e?.message || e?.code || e)}`;
        unitsBox.appendChild(p);
      }
    }

    async function loadFirebaseSdk() {
      try {
        const appMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
        const authMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
        const fsMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
        return { ...appMod, ...authMod, ...fsMod };
      } catch (_) {
        const appMod = await import("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app.js");
        const authMod = await import("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth.js");
        const fsMod = await import("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore.js");
        return { ...appMod, ...authMod, ...fsMod };
      }
    }

    async function ensureAuthenticatedUser(auth, onAuthStateChanged, signInAnonymously) {
      if (auth.currentUser) {
        return auth.currentUser;
      }
      await signInAnonymously(auth);
      if (auth.currentUser) {
        return auth.currentUser;
      }
      return await new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          unsub();
          reject(new Error("Délai dépassé lors de la connexion anonyme Firebase."));
        }, 8000);
        const unsub = onAuthStateChanged(auth, (user) => {
          if (user) {
            clearTimeout(timer);
            unsub();
            resolve(user);
          }
        }, (err) => {
          clearTimeout(timer);
          unsub();
          reject(err);
        });
      });
    }

      function unlockAudio() {
        const AudioContextCls = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCls) return;
        if (!audioCtx) {
          audioCtx = new AudioContextCls();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        btnSound.textContent = "Son : ON";
        btnSound.classList.add("on");
      }

      function playAlarmBeep() {
        if (!audioCtx || audioCtx.state !== "running") return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(660, now + 0.18);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.38);
      }

      function startSiren() {
        if (sirenTimer || sirenMutedForCurrentAlert) return;
        unlockAudio();
        playAlarmBeep();
        sirenTimer = setInterval(playAlarmBeep, 900);
      }

      function stopSiren() {
        if (sirenTimer) {
          clearInterval(sirenTimer);
          sirenTimer = null;

      function normStatus(c) {
        const u = String(c || "PATROUILLE").toUpperCase();
        return Object.prototype.hasOwnProperty.call(STATUS_LABELS, u) ? u : "PATROUILLE";
      }

      function formatCrew(count) {
        const n = Math.max(1, Number(count || 1));
        return `${n} agent${n > 1 ? "s" : ""}`;
      }

      function inferStatusFromEntry(entry) {
        if (entry.newStatus) {
          return normStatus(entry.newStatus);
        }
        const msg = String(entry.message || "");
        const arrowIdx = msg.lastIndexOf("->");
        if (arrowIdx !== -1) {
          const target = msg.slice(arrowIdx + 2).trim().toLowerCase();
          if (target.includes("fin de service")) return "FIN_DE_SERVICE";
          if (target.includes("intervention")) return "INTERVENTION";
          if (target.includes("lieux")) return "SUR_LIEUX";
          if (target.includes("contrôle") || target.includes("controle") || target.includes("route")) return "CONTROLE_ROUTE";
          if (target.includes("disponible")) return "DISPONIBLE";
          if (target.includes("pause")) return "PAUSE";
          if (target.includes("patrouille")) return "PATROUILLE";
        }
        return null;
      }

      function makeIcon(id, code, label, crewCount, sosActive) {
        const st = normStatus(code);
        const wrap = document.createElement("div");
        wrap.className = "marker-wrap";

        const dot = document.createElement("div");
        dot.className = sosActive ? "marker-dot sos-marker-dot" : `marker-dot st-${st}`;

        const tag = document.createElement("div");
        tag.className = sosActive ? "marker-tag sos-marker-tag" : "marker-tag";
        tag.textContent = sosActive
          ? `SOS · ${String(id ?? "")} (${formatCrew(crewCount)})`
          : `${String(id ?? "")} · ${formatCrew(crewCount)}`;

        const sub = document.createElement("span");
        sub.className = "marker-sub";
        sub.textContent = sosActive ? "ALERTE URGENCE" : String(label ?? "");

        tag.appendChild(sub);
        wrap.appendChild(dot);
        wrap.appendChild(tag);

        return L.divIcon({
          className: "",
          html: wrap.outerHTML,
          iconSize: [22, 22],
          iconAnchor: [11, 11],
          popupAnchor: [0, -14]
        });
      }

      function makePopupNode(id, label, crewCount, speed, equipment, sosActive, sosAddress) {
        const container = document.createElement("div");
        container.style.color = "#0f172a";
        container.style.fontSize = "12px";

        container.appendChild(title);
        container.appendChild(document.createElement("br"));

        if (sosActive && sosAddress) {

          container.appendChild(document.createElement("br"));
        }

        const l0 = document.createElement("span");
        l0.textContent = `Effectif : ${formatCrew(crewCount)}`;
        container.appendChild(l0);
        container.appendChild(document.createElement("br"));

        const l1 = document.createElement("span");
        l1.textContent = `Statut : ${label}`;
        container.appendChild(l1);
        container.appendChild(document.createElement("br"));

        const l2 = document.createElement("span");
        l2.textContent = `Vitesse : ${speed.toFixed(1)} km/h`;
        container.appendChild(l2);
        container.appendChild(document.createElement("br"));

        const l3 = document.createElement("span");
        l3.textContent = `Matériel : ${equipment.length ? equipment.join(", ") : "Aucun"}`;

      function stopTrail() {
        if (unsubTrail) { unsubTrail(); unsubTrail = null; }
        if (trailLine && map) { map.removeLayer(trailLine); trailLine = null; }
      }

      function startTrail(id) {
        stopTrail();
        if (!trailOn || !id || !map) return;
        const qHist = query(collection(db, "live_positions", id, "history"), orderBy("updatedAt", "desc"), limit(50));
        unsubTrail = onSnapshot(qHist, (snap) => {
          const pts = [];
          snap.forEach((d) => {
            const x = d.data() || {};
            if (typeof x.latitude === "number" && typeof x.longitude === "number") {
              pts.push([x.latitude, x.longitude]);
            }
          });
          pts.reverse();
          if (trailLine) map.removeLayer(trailLine);
          if (pts.length > 1) {
            trailLine = L.polyline(pts, { color: "#38bdf8", weight: 3, dashArray: "6,6" }).addTo(map);
          }
        }, () => {});
      }

      function fitAllUnits() {
        if (!map || typeof L === "undefined") return;
        const pts = units
          .filter((u) => typeof u.lat === "number" && typeof u.lng === "number")
          .map((u) => [u.lat, u.lng]);
        if (pts.length > 0) {
          map.fitBounds(pts, { padding: [36, 36], maxZoom: 15 });
        }
      }

      function pickUnit(id, center) {
        selectedId = id;
        document.getElementById("sel-txt").textContent = id || "Aucune";
        const u = units.find((item) => item.id === id);
        if (u && center && map && typeof u.lat === "number" && typeof u.lng === "number") {
          map.setView([u.lat, u.lng], 16);
          markers.get(id)?.openPopup();
        }
        startTrail(id);
        renderUnits();
      }

      function renderUnits() {
        const sorted = [...units].sort((a, b) => (b.sosActive ? 1 : 0) - (a.sosActive ? 1 : 0));
        const list = filterCode === "ALL" ? sorted : sorted.filter((u) => u.status === filterCode || u.sosActive);
        const totalCrew = units.reduce((acc, u) => acc + Math.max(1, Number(u.crewCount || 1)), 0);
        document.getElementById("cnt-all").textContent = String(units.length);
        document.getElementById("cnt-crew").textContent = String(totalCrew);
        document.getElementById("cnt-int").textContent = String(units.filter((u) => u.status === "INTERVENTION").length);

      function renderMci() {
        mciBox.textContent = "";
        const filtered = mciEntries.filter((x) => {
          const msg = String(x.message || "");
          const isSos = x.type === "SOS" || x.type === "SOS_END" || msg.startsWith("ALERTE SOS") || msg.startsWith("FIN ALERTE SOS") || msg.startsWith("ACQUITTEMENT SOS");
          const isStatus = x.type === "STATUS_CHANGE" || msg.startsWith("Statut :");
          const isDispatch = x.type === "DISPATCH" || msg.startsWith("Dispatch :");
          if (mciFilter === "SOS") return isSos;
          if (mciFilter === "STATUS") return isStatus;
          if (mciFilter === "DISPATCH") return isDispatch;
          return true;
        });

        if (filtered.length === 0) {
          const empty = document.createElement("p");
          empty.style.color = "#94a3b8";
          empty.style.fontSize = "11px";
          empty.textContent = "Aucune mention pour ce filtre.";
          mciBox.appendChild(empty);
          return;
        }

        filtered.forEach((x) => {
          const dt = x.createdAt?.toDate ? x.createdAt.toDate().toLocaleTimeString("fr-FR") : "--:--:--";
          const msg = String(x.message || "");
          const isSos = x.type === "SOS" || msg.startsWith("ALERTE SOS");
          const isSosEnd = x.type === "SOS_END" || msg.startsWith("FIN ALERTE SOS") || msg.startsWith("ACQUITTEMENT SOS");
          const isStatus = x.type === "STATUS_CHANGE" || msg.startsWith("Statut :");
          const isAck = x.type === "ACK" || msg.startsWith("Validé par ");
          const isArchive = x.type === "ARCHIVE" || msg.startsWith("Archivage intervention :");
          const stCode = isStatus ? inferStatusFromEntry(x) : null;

          const el = document.createElement("div");
          el.className = isSos
            ? "item sos-log"
            : (stCode
              ? `item mci-st-${stCode}`
              : ((isAck || isSosEnd) ? "item ack-log" : (isArchive ? "item archive-log" : "item")));

          const head = document.createElement("div");
          head.className = "mci-head";

          const timeDiv = document.createElement("div");
          timeDiv.className = "time";
          timeDiv.textContent = x.unitId ? `${dt} · ${x.unitId}` : dt;
          head.appendChild(timeDiv);

          if (isSos) {
            const sosBadge = document.createElement("span");
            sosBadge.className = "mci-badge st-SOS";
            sosBadge.textContent = "SOS";
            head.appendChild(sosBadge);
          } else if (isSosEnd) {
            const endBadge = document.createElement("span");
            endBadge.className = "mci-badge st-DISPONIBLE";
            endBadge.textContent = "Fin SOS";
            head.appendChild(endBadge);
          } else if (stCode) {
            const stBadge = document.createElement("span");
            stBadge.className = `mci-badge st-${stCode}`;
            stBadge.textContent = STATUS_LABELS[stCode];
            head.appendChild(stBadge);
          } else if (isAck) {
            const ackBadge = document.createElement("span");
            ackBadge.className = "mci-badge st-DISPONIBLE";
            ackBadge.textContent = "Validé";
            head.appendChild(ackBadge);
          } else if (isArchive) {
            const archBadge = document.createElement("span");
            archBadge.className = "mci-badge st-PAUSE";
            archBadge.textContent = "Archivé";
            head.appendChild(archBadge);
          }

          const msgDiv = document.createElement("div");
          msgDiv.textContent = msg;

          el.appendChild(head);
          el.appendChild(msgDiv);
          mciBox.appendChild(el);
        });
      }

      async function archiveMission(missionId, m) {
        const title = String(m.title || "Mission");
        const unitLabel = m.unitId ? ` (${m.unitId})` : "";
        const ackLabel = m.acknowledgedBy ? ` - Validé par ${m.acknowledgedBy}` : "";

        await updateDoc(doc(db, "missions", missionId), {
          archived: true,
          status: "ARCHIVEE",
          archivedAt: serverTimestamp()
        });

        await addDoc(collection(db, "mci_logs"), {
          unitId: m.unitId || "",
          type: "ARCHIVE",
          message: `Archivage intervention : ${title}${unitLabel}${ackLabel}`,
          createdAt: serverTimestamp()
        });
      }

      async function removeUnitOnEndOfService(docId, unitId, prevLabel, endLabel, crewCount) {
        if (pendingEndOfServiceDeletes.has(docId)) return;
        pendingEndOfServiceDeletes.add(docId);

        try {
          await addDoc(collection(db, "mci_logs"), {
            unitId,
            type: "STATUS_CHANGE",
            previousStatus: "END_OF_SERVICE_PREV",
            newStatus: "FIN_DE_SERVICE",
            message: `Statut : ${prevLabel} -> ${endLabel} (Équipage retiré · ${formatCrew(crewCount)})`,
            createdAt: serverTimestamp()
          });

          await deleteDoc(doc(db, "live_positions", docId));

          if (selectedId === unitId || selectedId === docId) {
            selectedId = null;
            document.getElementById("sel-txt").textContent = "Aucune";
            stopTrail();
          }
        } catch (err) {
          console.warn("Suppression fin de service:", err);
        } finally {
          pendingEndOfServiceDeletes.delete(docId);
        }
      }

      document.querySelectorAll(".fbtn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".fbtn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          filterCode = btn.dataset.f || "ALL";
          renderUnits();
        });
      });

      document.querySelectorAll(".mci-fbtn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mci-fbtn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          mciFilter = btn.dataset.mf || "ALL";
          renderMci();
        });
      });

      document.getElementById("btn-trail").addEventListener("click", (e) => {
        trailOn = !trailOn;
        e.currentTarget.textContent = `Trajet : ${trailOn ? "ON" : "OFF"}`;
        if (trailOn && selectedId) {
          startTrail(selectedId);
        } else {
          stopTrail();
        }
      });

      document.getElementById("btn-fit").addEventListener("click", () => {
        fitAllUnits();
      });

      onSnapshot(collection(db, "live_positions"), (snap) => {
        statusTxt.textContent = "En ligne";
        statusTxt.style.color = "#4ade80";
        const next = [];
        const seen = new Set();
        const bounds = [];

        snap.forEach((docSnap) => {
          const d = docSnap.data() || {};
          const id = String(d.unitId || docSnap.id);
          const crewCount = Math.max(1, Number(d.crewCount || 1));
          const st = normStatus(d.operationalStatus);
          const label = String(d.operationalStatusLabel || STATUS_LABELS[st]);
          const sosActive = Boolean(d.sosActive);
          const sosAddress = String(d.sosAddress || "");
          const prevState = lastKnownStatus.get(id);

          if (st === "FIN_DE_SERVICE") {
            const prevLabel = prevState ? prevState.label : "En service";
            removeUnitOnEndOfService(docSnap.id, id, prevLabel, label, crewCount);
            if (markers.has(id) && map) {
              map.removeLayer(markers.get(id));
              markers.delete(id);
            }
            return;
          }

          const equipment = Array.isArray(d.equipment) ? d.equipment : [];
          const lat = typeof d.latitude === "number" ? d.latitude : null;
          const lng = typeof d.longitude === "number" ? d.longitude : null;
          const speed = typeof d.speedKmh === "number" ? d.speedKmh : 0;
          const tracking = Boolean(d.isTracking);

          if (initialUnitsLoaded && prevState && prevState.status !== st) {
            addDoc(collection(db, "mci_logs"), {
              unitId: id,
              type: "STATUS_CHANGE",
              previousStatus: prevState.status,
              newStatus: st,
              message: `Statut : ${prevState.label} -> ${label}`,
              createdAt: serverTimestamp()
            }).catch((err) => console.warn("MCI status log:", err));
          }
          lastKnownStatus.set(id, { status: st, label });

          seen.add(id);
          next.push({
            docId: docSnap.id,
            id,
            crewCount,
            status: st,
            label,
            equipment,
            lat,
            lng,
            speed,
            tracking,
            sosActive,
            sosAddress
          });

          if (lat !== null && lng !== null && map && typeof L !== "undefined") {
            bounds.push([lat, lng]);
            const popNode = makePopupNode(id, label, crewCount, speed, equipment, sosActive, sosAddress);
            const icon = makeIcon(id, st, label, crewCount, sosActive);
            if (markers.has(id)) {
              const m = markers.get(id);
              m.setLatLng([lat, lng]);
              m.setIcon(icon);
              m.setPopupContent(popNode);
              if (sosActive) m.openPopup();
            } else {
              const m = L.marker([lat, lng], { icon }).addTo(map).bindPopup(popNode).on("click", () => pickUnit(id, false));
              markers.set(id, m);
              if (sosActive) m.openPopup();
            }
          } else if (markers.has(id) && map) {
            map.removeLayer(markers.get(id));
            markers.delete(id);
          }
        });

        initialUnitsLoaded = true;

        if (map) {
          markers.forEach((m, id) => {
            if (!seen.has(id)) { map.removeLayer(m); markers.delete(id); }
          });
        }

        units = next;
        const previousSosIds = activeSosUnits.map((u) => u.id).join(",");
        activeSosUnits = units.filter((u) => u.sosActive);
        const currentSosIds = activeSosUnits.map((u) => u.id).join(",");

        if (activeSosUnits.length > 0) {
          if (currentSosIds !== previousSosIds) {
            sirenMutedForCurrentAlert = false;
            const firstSos = activeSosUnits[0];
            if (map && typeof firstSos.lat === "number" && typeof firstSos.lng === "number") {
              map.setView([firstSos.lat, firstSos.lng], 16);
            }
          }
          const primary = activeSosUnits[0];
          const extra = activeSosUnits.length > 1 ? ` (+${activeSosUnits.length - 1} autre)` : "";
          sosBannerTitle.textContent = `ALERTE SOS · ${primary.id} (${formatCrew(primary.crewCount)})${extra}`;
          sosBannerAddr.textContent = primary.sosAddress
            ? `Adresse signalée : ${primary.sosAddress}`
            : (typeof primary.lat === "number" && typeof primary.lng === "number"
              ? `Coordonnées GPS : ${primary.lat.toFixed(5)}, ${primary.lng.toFixed(5)}`
              : "Acquisition de la position GPS...");
          sosBanner.classList.add("active");
          startSiren();
        } else {
          sosBanner.classList.remove("active");
          sirenMutedForCurrentAlert = false;
          stopSiren();
        }

        renderUnits();
        if (!fittedOnce && bounds.length > 0 && map) {
          fittedOnce = true;
          map.fitBounds(bounds, { padding: [36, 36], maxZoom: 15 });
        }
      }, (err) => showErr("Firestore live_positions", err));

      onSnapshot(query(collection(db, "missions"), orderBy("createdAt", "desc"), limit(30)), (snap) => {
        missionsBox.textContent = "";
        snap.forEach((d) => {
          const m = d.data() || {};
          if (m.archived === true) return;

          const el = document.createElement("div");
          el.className = "item";

          const uLine = document.createElement("div");
          uLine.style.color = "#38bdf8";
          uLine.style.fontWeight = "700";
          uLine.textContent = `Unité : ${m.unitId || "Non affectée"}`;
          el.appendChild(uLine);

          const title = document.createElement("strong");
          title.style.display = "block";
          title.style.marginTop = "2px";
          title.textContent = m.title || "Mission";
          el.appendChild(title);

          if (m.notes) {
            const nLine = document.createElement("div");
            nLine.style.color = "#cbd5e1";
            nLine.style.marginTop = "3px";
            nLine.textContent = m.notes;
            el.appendChild(nLine);
          }

          if (m.acknowledgedBy) {
            const aLine = document.createElement("div");
            aLine.style.color = "#4ade80";
            aLine.style.marginTop = "3px";
            aLine.style.fontWeight = "700";
            aLine.textContent = `Validé par ${m.acknowledgedBy}`;
            el.appendChild(aLine);

            const actions = document.createElement("div");
            actions.className = "mission-actions";

            const btnArch = document.createElement("button");
            btnArch.type = "button";
            btnArch.className = "btn-archive";
            btnArch.textContent = "Archiver";
            btnArch.addEventListener("click", async () => {
              btnArch.disabled = true;
              btnArch.textContent = "Archivage...";
              try {
                await archiveMission(d.id, m);
              } catch (err) {
                console.warn("Archive mission:", err);
                btnArch.disabled = false;
                btnArch.textContent = "Archiver";
              }
            });

            actions.appendChild(btnArch);
            el.appendChild(actions);
          }

          missionsBox.appendChild(el);
        });
      }, (err) => console.warn("missions:", err));

      onSnapshot(query(collection(db, "mci_logs"), orderBy("createdAt", "desc"), limit(80)), (snap) => {
        const list = [];
        snap.forEach((d) => {
          list.push(d.data() || {});
        });
        mciEntries = list;
        renderMci();
      }, (err) => console.warn("mci_logs:", err));

      document.getElementById("f-dispatch").addEventListener("submit", async (e) => {
        e.preventDefault();
        const unitId = mUnitSel.value.trim();
        const title = document.getElementById("m-title").value.trim();
        const notes = document.getElementById("m-notes").value.trim();
        if (!title) return;
        await addDoc(collection(db, "missions"), { unitId, title, notes, status: "OUVERTE", createdAt: serverTimestamp() });
        await addDoc(collection(db, "mci_logs"), {
          unitId,
          type: "DISPATCH",
          message: `Dispatch : ${title}${unitId ? ` -> ${unitId}` : ""}${notes ? ` (${notes})` : ""}`,
          createdAt: serverTimestamp()
        });
        e.target.reset();
      });

      document.getElementById("f-mci").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("c-msg");
        const message = input.value.trim();
        if (!message) return;
        await addDoc(collection(db, "mci_logs"), {
          unitId: selectedId || "",
          type: "MANUAL",
          message,
          createdAt: serverTimestamp()
        });
        input.value = "";
      });
    } catch (err) {
      showErr("Initialisation CSU", err);
    }
  </script>
</body>
</html>
